<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="خليك ذكي خليك نبهان - قراءة وتحميل الكتب بصيغة PDF">
    <title>خليك ذكي خليك نبهان</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <header class="app-header">
        <div class="header-container">
            <h1><i class="ri-book-open-line"></i> خليك ذكي خليك نبهان</h1>
        </div>
    </header>

    <main class="container">
        <div id="books-list" class="books-grid">
            <!-- Books will be injected here by app.js -->
        </div>
    </main>

    <!-- PDF Viewer Modal -->
    <div id="pdf-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">عنوان الكتاب</h2>
                <button id="close-modal" class="close-btn"><i class="ri-close-line"></i></button>
            </div>
            <div class="modal-body">
                <div class="loader" id="pdf-loader"></div>
                <iframe id="pdf-frame" src="" frameborder="0" style="display: none;"></iframe>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
